name: Publicar versiones

# Compila cada versión de releases/versions.json desde su commit y la publica como release con su APK
# y sus notas de CHANGELOG.md. Las versiones ya publicadas se saltan.
on:
  push:
    paths:
      - "releases/versions.json"
      - "CHANGELOG.md"
      - ".github/workflows/releases.yml"
  workflow_dispatch:

permissions:
  contents: write

# Una publicación detrás de otra: si coinciden dos, la segunda espera y ya ve lo publicado.
concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending="[]"
          for row in $(jq -c '.[]' releases/versions.json); do
            v=$(echo "$row" | jq -r .version)
            c=$(echo "$row" | jq -r .commit)
            [ "$c" = "HEAD" ] && c="$GITHUB_SHA"
            if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$v ya publicada"
            else
              pending=$(echo "$pending" | jq -c --arg v "$v" --arg c "$c" '. + [{version: $v, commit: $c}]')
            fi
          done
          echo "matrix=$pending" >> "$GITHUB_OUTPUT"
          echo "Pendientes: $pending"

  release:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # si una versión falla, las demás se publican igual
      max-parallel: 1   # en orden, para que la última quede como «latest»
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Repositorio actual (notas de la versión)
        uses: actions/checkout@v4
        with:
          path: actual
      - name: Código de la versión ${{ matrix.version }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          path: version
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Clave de firma privada (secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.REPISA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto REPISA_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/repisa-release.jks"
          echo "REPISA_KEYSTORE=$RUNNER_TEMP/repisa-release.jks" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: version
        env:
          REPISA_KEYSTORE_PASSWORD: ${{ secrets.REPISA_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Comprobar la firma
        run: |
          apk=version/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"/apksigner verify --print-certs "$apk" | grep -i "CN=Repisa" \
            || { echo "::error::El APK no está firmado con la clave de Repisa."; exit 1; }
      - name: Notas de la versión
        run: |
          awk -v v="${{ matrix.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' actual/CHANGELOG.md > notas.md
          printf '\n---\nInstala `Repisa-%s.apk` en tu consola o móvil Android.\n' "${{ matrix.version }}" >> notas.md
          cat notas.md
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ matrix.version }}"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$v ya existe (la publicó otra ejecución)."; exit 0
          fi
          cp version/app/build/outputs/apk/release/app-release.apk "Repisa-$v.apk"
          # Solo la versión más nueva de releases/versions.json queda como «latest».
          newest=$(jq -r '.[-1].version' actual/releases/versions.json)
          latest=false; [ "$v" = "$newest" ] && latest=true
          gh release create "v$v" "Repisa-$v.apk" \
            --repo "$GITHUB_REPOSITORY" --target "${{ matrix.commit }}" \
            --title "Repisa $v" --notes-file notas.md --latest=$latest
